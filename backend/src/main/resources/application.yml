server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/styk}
    username: ${DATABASE_USER:styk}
    password: ${DATABASE_PASSWORD:styk-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 5MB
styk:
  seed: ${DEMO_SEED:false}
  demo-password: ${DEMO_PASSWORD:}
  replenishment-delay: ${REPLENISHMENT_DELAY:60000}
---
server:
  port: ${PORT:8091}
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/styk;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ''
styk:
  seed: true
  demo-password: ${DEMO_PASSWORD:StykDemo2026!}
