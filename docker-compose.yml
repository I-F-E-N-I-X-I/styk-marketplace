services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: styk
      POSTGRES_USER: styk
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-styk-local-change-me}
    volumes:
      - styk-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U styk -d styk"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/styk
      DATABASE_USER: styk
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-styk-local-change-me}
      DEMO_SEED: ${DEMO_SEED:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-StykDemo2026!}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - backend
volumes:
  styk-data:
